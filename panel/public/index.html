<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ghost-BOT Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>👻 Ghost-BOT</h1>
    <p id="status">Cargando estado...</p>

    <button onclick="loadStatus()">🔄 Actualizar</button>
  </div>

  <script>
    async function loadStatus() {
      try {
        const res = await fetch('/api/status')
        const data = await res.json()
        document.getElementById('status').innerText =
          `Estado: ${data.status}\nUptime: ${Math.floor(data.uptime)}s`
      } catch (e) {
        document.getElementById('status').innerText = 'Error al obtener estado'
      }
    }

    loadStatus()
  </script>

</body>
</html>
